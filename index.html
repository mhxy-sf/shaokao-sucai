<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="烧烤店图片素材库，门店展示、菜品、环境等图片素材浏览与下载">
  <title>XX烧烤店 · 配方与图片素材库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <h1 id="siteName">XX烧烤店</h1>
        <p id="siteSubtitle" class="subtitle">资源素材库</p>
      </div>
    </div>
    <!-- 板块切换 -->
    <nav class="boards" id="boards" aria-label="板块切换">
      <button class="board-btn active" data-board="recipes">配方</button>
      <button class="board-btn" data-board="gallery">图片素材</button>
    </nav>
    <nav class="tabs" id="tabs" aria-label="分组导航" style="display:none"></nav>
  </header>

  <main class="main">
    <!-- 配方板块 -->
    <section class="board" id="board-recipes">
      <div id="recipes-root"></div>
    </section>

    <!-- 图片素材板块 -->
    <section class="board" id="board-gallery" hidden>
      <div id="main"></div>
    </section>
  </main>

  <!-- 图片大图预览弹层 -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-body">
      <button class="lightbox-close" data-close aria-label="关闭">&times;</button>
      <img class="lightbox-img" id="lightboxImg" alt="预览图">
      <div class="lightbox-footer">
        <span class="lightbox-name" id="lightboxName"></span>
        <a class="btn btn-download" id="lightboxDownload" download>下载原图</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>配方与图片素材由管理员维护，欢迎使用</p>
  </footer>

  <script src="app.js"></script>
  <script src="recipes.js"></script>
</body>
</html>
